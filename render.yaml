# Blueprint Render — API + frontend en un solo servicio
# Base de datos: Neon PostgreSQL (gratis). Ver DEPLOY.md.

services:
  - type: web
    name: gantt-produccion
    runtime: python
    plan: free
    buildCommand: chmod +x scripts/render-build.sh && ./scripts/render-build.sh
    startCommand: cd backend && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: GANTT_JWT_SECRET
        generateValue: true
      - key: GANTT_APP_URL
        sync: false
      - key: DATABASE_URL
        sync: false
